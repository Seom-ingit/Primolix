name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Byte-compile the package
        run: python -m compileall -q primolix

      - name: End-to-end test
        run: python tests/test_primolix_e2e.py

      - name: Kernel unit tests
        run: python tests/test_kernel_unit.py

      - name: Staged publish tests
        run: python tests/test_staged_publish.py

      - name: Runnable example
        run: python examples/run_examples.py
