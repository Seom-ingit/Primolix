[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primolix"
version = "0.2.3"
description = "Primitive-first sparse retrieval kernel: store invertible primitives (tf/df/dl + tombstones), derive scores at query time. Successor to the ZELIX line."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"                          # SPDX expression (PEP 639; needs setuptools >= 77)
license-files = ["LICENSE"]
authors = [{ name = "primolix contributors" }]
keywords = ["primolix", "bm25", "retrieval", "rag", "sparse", "incremental", "mmap", "knowledge-base"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dense = ["torch>=2.0", "transformers>=4.40"]     # optional: dense reranking (not on the core path)
research = ["psutil>=5.9"]                        # optional: memory measurements

[project.scripts]
primolix = "primolix.cli:main"

[tool.setuptools]
packages = ["primolix"]

[tool.setuptools.package-data]
primolix = ["py.typed"]
